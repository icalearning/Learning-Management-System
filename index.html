<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ICA Clinician Hub | ICA Counselling &amp; Supervision</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#243F32;--side:#1D352A;--card:#F5EEDF;--cream:#FAF6EC;--gold:#D9A84E;--sage:#A9BBA3;--fg:#F5EEDF;--mut:#bfcbb9;--cf:#1D352A;--ch:#243F32;--cm:#5d6b60;--cl:#1d352a26;--h:"Playfair Display",Georgia,serif;--b:"DM Sans",system-ui,sans-serif}
:root[data-theme=light]{--bg:#FAF6EC;--fg:#1D352A;--mut:#5d6b60}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 var(--b);transition:background .3s,color .3s}
h1,h2,h3{font-family:var(--h);line-height:1.2;margin:0 0 .5em;font-weight:500}h1{font-size:clamp(30px,5vw,46px)}
.card h1,.card h2,.card h3,details h3{color:var(--ch)}
a{color:var(--gold)}.card a:not(.btn),details a{color:#9a6a14}
.lb{font:600 11px var(--b);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
nav{background:var(--side);color:#F5EEDF;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid #ffffff14}
nav img{width:100%;max-width:190px;display:block;margin:0 auto 18px;background:#F5EEDF;border-radius:12px;padding:8px}
nav a.l{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:8px;color:#F5EEDF;text-decoration:none;font-weight:500;font-size:15px;border-left:3px solid transparent;transition:.2s}
nav a.l:hover{background:#ffffff12;transform:translateX(3px)}nav a.l.on{border-left-color:var(--gold);background:#ffffff14;color:var(--gold)}
nav a.s{padding:3px 12px 3px 40px;font-size:13px;color:var(--sage);display:block;text-decoration:none}nav a.s.on{color:var(--gold)}nav a.s:hover{color:#fff}
.bar{height:6px;background:#ffffff22;border-radius:9px;overflow:hidden;margin:16px 4px 4px}.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .6s}
nav .mut{color:var(--sage);font-size:13px}nav .btn{width:100%}
main{padding:32px clamp(16px,4vw,52px) 70px;max-width:1120px;width:100%}
.top{display:none}
section{animation:in .45s ease}@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.hero{background:var(--side);border:1px solid #ffffff1a;border-radius:6px;padding:clamp(26px,5vw,60px);color:#F5EEDF}
.hero h1{font-size:clamp(32px,6vw,58px);max-width:700px}.hero p{max-width:620px;color:#d7dfd2}
.btn{display:inline-block;background:var(--gold);color:#1D352A;border:0;padding:11px 22px;border-radius:4px;font:600 13px var(--b);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:.2s;margin:2px 4px 2px 0}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px #0004}.btn.o{background:transparent;border:1px solid var(--gold);color:var(--gold)}.card .btn.o{color:#7a5410;border-color:#9a6a14}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin:18px 0}
.card,details{background:var(--card);color:var(--cf);border:1px solid var(--cl);border-radius:10px;padding:20px;transition:.25s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px #0004}
details{padding:12px 18px;margin:10px 0}summary{cursor:pointer;font:500 18px var(--h);color:var(--ch)}details ul{padding-left:20px;margin:10px 0}details li{margin:4px 0}
.tag{display:inline-block;border:1px solid var(--cl);border-radius:99px;padding:1px 10px;font-size:12px;color:var(--cm);margin:0 4px 4px 0}
.mut{color:var(--mut);font-size:15px}.card .mut{color:var(--cm)}
hr{border:0;border-top:1px solid #ffffff22;margin:28px 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}
.vid{aspect-ratio:16/9;width:100%;border:0;border-radius:8px;background:#000}
input[type=text],input[type=url]{width:100%;padding:11px;border:1px solid var(--cl);border-radius:6px;background:#fff;color:#1D352A;font:inherit;margin:6px 0}
.q{margin:16px 0}.q label{display:block;padding:9px 12px;border:1px solid var(--cl);border-radius:6px;margin:6px 0;cursor:pointer;background:#fffdf8}.q label:hover{border-color:var(--gold)}
.ok{color:#2e7d4f;font-weight:600}.no{color:#b3402a;font-weight:600}
.done{color:var(--gold);font-weight:600}
.cert{background:#FAF6EC;color:#1D352A;border:10px double #D9A84E;padding:40px 24px;text-align:center;border-radius:4px;margin:16px 0}
.cert h1{color:#243F32}.cert .nm{font:500 clamp(28px,5vw,42px) var(--h);border-bottom:1px solid #D9A84E;display:inline-block;padding:0 24px;margin:10px 0}
canvas{max-width:100%;background:#fff}
@media(max-width:820px){.app{grid-template-columns:1fr}nav{position:fixed;z-index:20;left:0;width:280px;transform:translateX(-105%);transition:.3s;box-shadow:4px 0 20px #0006}nav.open{transform:none}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--side);color:#F5EEDF;position:sticky;top:0;z-index:10}.top button{background:none;border:0;font-size:24px;color:#F5EEDF;cursor:pointer}}
@media print{body *{visibility:hidden}.cert,.cert *{visibility:visible}.cert{position:absolute;left:0;top:0;width:100%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--hh:72px}
.hd{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:10px clamp(12px,3vw,28px);background:var(--side);color:#F5EEDF;border-bottom:1px solid #ffffff1a}
.hb{display:none;background:none;border:0;color:#F5EEDF;font-size:24px;cursor:pointer}
.ttl{display:flex;flex-direction:column;line-height:1.15;min-width:0}.ttl b{font:500 clamp(17px,2.2vw,24px) var(--h);white-space:nowrap}
.sr{position:relative;flex:1;max-width:420px;margin-left:auto}.sr input{margin:0;background:#ffffff14;color:#F5EEDF;border-color:#ffffff30}.sr input::placeholder{color:#bfcbb9}
#sres{position:absolute;left:0;right:0;top:100%;margin-top:6px;background:var(--card);color:var(--cf);border-radius:8px;box-shadow:0 12px 30px #0006;max-height:60vh;overflow:auto;z-index:40}#sres:empty{display:none}
#sres a{display:block;padding:10px 14px;text-decoration:none;color:var(--cf);border-bottom:1px solid var(--cl)}#sres a:hover{background:#fff}#sres small{display:block;color:var(--cm)}#sres .lb{color:#9a6a14;margin:0}
.hp{display:flex;align-items:center;gap:8px;width:170px}.hp .bar{flex:1;margin:0}.hp b{font-size:14px;color:var(--gold);min-width:40px;text-align:right}
#lg{height:48px;border-radius:8px;background:#FAF3E5}
nav{top:var(--hh);height:calc(100vh - var(--hh))}nav a.l span{flex:1}
.pc{margin-left:auto;font-style:normal;font-size:12px;color:var(--gold)}
section{animation:sld .5s cubic-bezier(.2,.7,.2,1)}@keyframes sld{from{opacity:0;transform:translateX(var(--dx,40px))}to{opacity:1;transform:none}}
.sl.in{animation:sld .45s cubic-bezier(.2,.7,.2,1)}.sl{min-height:240px}.sl h2{margin-bottom:.6em}
.dt{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffffff40;margin:0 3px;transition:.3s}.dt.on{background:var(--gold);width:22px;border-radius:9px}
.mb{height:5px;background:#1d352a22;border-radius:9px;overflow:hidden;margin-top:10px}.mb i{display:block;height:100%;background:var(--gold);transition:width .6s}
.btn:disabled{opacity:.35;pointer-events:none}
.grid>*{animation:up .5s both}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.grid>:nth-child(2){animation-delay:.06s}.grid>:nth-child(3){animation-delay:.12s}.grid>:nth-child(n+4){animation-delay:.18s}
.ck{display:flex;gap:10px;align-items:flex-start;padding:7px 0;cursor:pointer}.ck input{width:20px;height:20px;accent-color:#243F32;margin-top:3px}
.fc{perspective:1000px;max-width:560px;margin:18px 0;cursor:pointer}.fi{position:relative;height:270px;transition:transform .6s;transform-style:preserve-3d}.fc.flip .fi{transform:rotateY(180deg)}
.ff{position:absolute;inset:0;background:var(--card);color:var(--cf);border-radius:10px;padding:24px;display:flex;flex-direction:column;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--cl)}.ff h2{font-size:clamp(20px,3vw,26px);color:var(--ch)}.fb{transform:rotateY(180deg);background:var(--gold)}.ff small{color:var(--cm)}
.cert .sops ol{columns:2;text-align:left;font-size:14px;margin:8px 0 14px;padding-left:22px}.cert .meta{display:flex;justify-content:space-around;gap:12px;margin:14px 0;font-size:14px;flex-wrap:wrap}
@media(max-width:820px){.hb{display:block}.hd{flex-wrap:wrap;gap:10px}.ttl{order:1;flex:1}#lg{order:2;height:40px}.sr{order:3;flex:1 1 55%;max-width:none;margin:0}.hp{order:4;flex:1 1 35%;width:auto}.cert .sops ol{columns:1}}
@media print{.hd{display:none}}
</style></head><body>
<header class="hd" id="hd"><button class="hb" onclick="tg()" aria-label="Menu">☰</button><div class="ttl"><span class="lb">Learning Management System</span><b>ICA Learning Institute</b></div><div class="sr"><input type="text" id="q" placeholder="Search modules, glossary, courses…" oninput="srch(this.value)" autocomplete="off"><div id="sres"></div></div><div class="hp" title="Overall progress"><div class="bar"><i id="pb"></i></div><b id="pt">0%</b></div><img id="lg" alt="ICA Counselling &amp; Supervision"></header>
<div class="app"><nav id="nav"><div id="links"></div><button class="btn o" onclick="theme()" style="margin-top:14px;width:100%">◐ Forest / light</button><p class="mut" style="padding:10px 4px">Wilson St W, Hamilton, ON<br><a href="tel:+19055195158">905-519-5158</a><br><a href="mailto:info@icacounselling.ca">info@icacounselling.ca</a></p></nav><main id="m"></main></div>

{t:"Welcome to ICA",s:"Every act of healing is an act of rebellion.",x:[["Our story","¶ICA was founded by Ilda Caeiro-Azzam, MSW, RSW, a registered social worker and psychotherapist with 21+ years of clinical experience in trauma, complex PTSD and work with refugee, newcomer and marginalized communities. It has grown into a multilingual team united by trauma-informed, anti-oppressive, culturally responsive care. ICA is an approved IFHP and NIHB provider and works virtually across Ontario, Nova Scotia and Quebec, and in person in Hamilton/Ancaster."],["What we believe","Healing is relational: clients are matched by language, culture, faith and identity|Access is a clinical issue: direct billing (IFHP, NIHB, WSIB), sliding scale, free interpreters|Culture is a resource to work with, not a barrier|Clinicians deserve care too: supervision, reflective practice, attention to burnout and vicarious trauma"],["Who we serve","Everyone is welcome, with particular depth with refugee claimants and newcomers, BIPOC communities, 2SLGBTQ+ clients, injured workers (WSIB), survivors of complex trauma and IPV, and helping professionals with compassion fatigue. Sessions in English, French, Arabic, Farsi, Urdu, Portuguese, Spanish, Dari, Somali, Russian and Bangla; interpreters for other languages at no cost."],["Land acknowledgement","ICA is in Hamilton on the traditional territories of the Erie, Neutral, Huron-Wendat, Haudenosaunee and Mississaugas, protected by the Dish With One Spoon Wampum Belt Covenant. Commitments: serve eligible First Nations and Inuit clients through NIHB|share Indigenous-led crisis resources (Hope for Wellness Helpline, MMIWG Crisis Line)|ongoing cultural safety education and accountability to the TRC Calls to Action (18–24)|listen, learn and correct ourselves"]]},

videos:()=>{const all=[...VIDEOS,...st.vids];return`<div class="lb">Watch</div><h1>Video library</h1><div class="card"><b>Add a video</b><input type="url" id="vu" placeholder="Paste a YouTube link or embed code"><input type="text" id="vt" placeholder="Title"><button class="btn" onclick="addV()">Add</button><p class="mut">Saved in this browser only. To share with all clinicians, add the video to <code>VIDEOS</code> in index.html.</p></div><div class="grid">${all.map(v=>`<div class="card"><iframe class="vid" loading="lazy" src="https://www.youtube.com/embed/${v.id}" title="${v.t}" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe><h3 style="margin-top:10px">${v.t}</h3></div>`).join("")}</div>`},
library:()=>`<div class="lb">Reference</div><h1>Slides &amp; documents</h1><div id="viewer"></div><div class="grid">${DOCS.map((d,i)=>`<div class="card"><span class="tag">${d.k}</span><h3>${d.t}</h3><p class="mut">${d.d}</p><button class="btn" onclick="openDeck(${i})">Preview</button><a class="btn o" href="${d.dl}" download>Download</a></div>`).join("")}</div><hr><h2>Recommended reading</h2><div class="grid">${BOOKS.map(b=>`<div class="card"><b>${b[0]}</b><br><span class="mut">${b[1]}</span><br><span class="tag">${b[2]}</span></div>`).join("")}</div>`,
booking:()=>`<div class="lb">Schedule</div><h1>Booking</h1><div class="card"><h3>ICA on Jane</h3><p class="mut">Keep your Jane availability current and offer every prospect the free 15-minute consultation.</p><a class="btn" href="https://icacounsellingsupervision.janeapp.com/" target="_blank" rel="noopener">Open booking page ↗</a></div>`,
certificate:()=>{const left=[1,2,3,4,5,6,7,8].filter(n=>!st.ck.includes(n));if(st.pass&&!left.length)return`<h1>Your certificate</h1>${cert()}`;
return`<div class="lb">Final check</div><h1>Knowledge check &amp; certificate</h1>${left.length?`<div class="card"><b>Modules still to complete:</b> ${left.map(n=>`<a href="#m${n}">${n}</a>`).join(", ")}<p class="mut">Your certificate unlocks once all modules are done and the check is passed.</p></div>`:""}${st.pass?`<p class="done">✓ Knowledge check passed</p>`:`<div class="card"><p class="mut">Answer all ${QZ.length} questions. 80% to pass; retry as often as you like.</p>${QZ.map((q,i)=>`<div class="q"><b>${i+1}. ${q[0]}</b>${q[1].map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join("")}</div>`).join("")}<button type="button" class="btn" onclick="grade()">Submit answers</button> <span id="res"></span></div>`}`}};
function cert(){if(!st.cert){const d=new Date(),p=n=>String(n).padStart(2,"0");st.cert={no:"ICA-LI-"+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"-"+Math.random().toString(36).slice(2,8).toUpperCase(),date:d.toISOString()};sv()}
const dt=new Date(st.cert.date).toLocaleDateString("en-CA",{year:"numeric",month:"long",day:"numeric"});
return`<div class="card"><label>Name on certificate<input type="text" value="${st.name}" placeholder="Your full name" oninput="st.name=this.value;sv();$('#cnm').textContent=this.value||'Your Name'"></label></div><div class="cert"><img src="${LOGO}" alt="" style="height:70px"><p style="letter-spacing:.25em;font-size:12px">ICA LEARNING INSTITUTE</p><h1>Certificate of Completion</h1><p>This certifies that</p><div class="nm" id="cnm">${st.name||"Your Name"}</div><p>has completed New Clinician Onboarding and passed the knowledge check${st.sc?" ("+st.sc+")":""}, covering the following SOPs:</p><div class="sops"><ol>${OM.map(m=>`<li>${m.t}</li>`).join("")}</ol></div><div class="meta"><span>Certificate no.<br><b>${st.cert.no}</b></span><span>Date issued<br><b>${dt}</b></span></div><p style="font-size:13px">Clinical Director: Ilda Caeiro-Azzam, MSW, RSW<br>ICA Counselling &amp; Supervision · Wilson St W, Hamilton, ON</p></div><button class="btn" onclick="print()">Print / save as PDF</button>`}
function grade(){let s=0,miss=0;QZ.forEach((q,i)=>{const c=document.querySelector(`input[name=q${i}]:checked`);if(!c)miss++;else if(+c.value===q[2])s++});if(miss){$("#res").innerHTML=`<span class="no">Please answer all questions (${miss} left).</span>`;return}
const p=s/QZ.length>=.8;$("#res").innerHTML=`<span class="${p?"ok":"no"}">${s}/${QZ.length} ${p?"Passed 🎉":"Not yet. Review the modules and retry."}</span>`;if(p){st.pass=true;st.sc=s+"/"+QZ.length;sv();prog();setTimeout(route,1000)}}
function addV(){const m=($("#vu").value).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);if(!m)return alert("Please paste a valid YouTube link.");st.vids.push({t:$("#vt").value||"Video",id:m[1]});sv();route()}
let pdf,pg=1,cur=location.hash.slice(1)||"welcome";
function loadJs(){return window.pdfjsLib?Promise.resolve():new Promise((r,j)=>{const s=document.createElement("script"),u="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";s.src=u+"pdf.min.js";s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc=u+"pdf.worker.min.js";r()};s.onerror=j;document.head.appendChild(s)})}
async function openDeck(i){const d=DOCS[i],v=$("#viewer");if(!st.pv.includes(i)){st.pv.push(i);sv();prog()}v.innerHTML=`<div class="card" style="margin-bottom:16px"><h3>${d.t}</h3><div id="vst" class="mut">Loading preview…</div><canvas id="cv" style="width:100%;border:1px solid #0002;border-radius:6px"></canvas><div class="tabs"><button class="btn o" onclick="pp(-1)">← Prev</button><b id="pn"></b><button class="btn o" onclick="pp(1)">Next →</button><button class="btn o" onclick="fs()">Fullscreen</button><a class="btn" href="${d.dl}" download>Download</a></div></div>`;v.scrollIntoView({behavior:"smooth"});
try{await loadJs();pdf=await pdfjsLib.getDocument(d.pdf).promise;pg=1;draw()}catch(e){$("#cv").remove();$("#vst").innerHTML=`<iframe src="${d.pdf}" style="width:100%;height:70vh;border:1px solid #0002;border-radius:6px"></iframe>`}}
async function draw(){const p=await pdf.getPage(pg),vp=p.getViewport({scale:1.8}),c=$("#cv");c.width=vp.width;c.height=vp.height;await p.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;$("#pn").textContent=pg+" / "+pdf.numPages;$("#vst").textContent=""}
function pp(n){if(pdf){pg=Math.min(pdf.numPages,Math.max(1,pg+n));draw()}}
function fs(){const c=$("#cv");c&&c.requestFullscreen&&c.requestFullscreen()}
addEventListener("keydown",e=>{if(pdf&&$("#cv")){if(e.key=="ArrowRight")pp(1);if(e.key=="ArrowLeft")pp(-1)}});
const NAV=[["welcome","Welcome"],["gs","Getting started"],["onboarding","Onboarding modules"],["glossary","Glossary"],["flashcards","Flashcards"],["courses","Courses"],["modalities","Modalities (Canada)"],["videos","Video library"],["library","Slides & documents"],["booking","Booking"],["certificate","Final check & certificate"]];
const ORDER=["welcome","gs","onboarding",...[1,2,3,4,5,6,7,8].map(n=>"m"+n),"glossary","flashcards","courses","modalities","videos","library","booking","certificate"];
function renderNav(){const k=cur;$("#links").innerHTML=NAV.map(n=>{const f=SP[n[0]];return`<a class="l ${n[0]==k?"on":""}" href="#${n[0]}"><span>${n[1]}</span>${f?`<em class="pc">${f()}%</em>`:""}</a>`+(n[0]=="onboarding"?OM.map((m,i)=>`<a class="s ${k=="m"+(i+1)?"on":""}" href="#m${i+1}">${st.ck.includes(i+1)?"✓":i+1}  ${m.t} <em class="pc">${pm(i+1)}%</em></a>`).join(""):"")}).join("")}
let prev="welcome";
function go(k){cur=k;try{history.replaceState(null,"","#"+k)}catch(e){}route()}
function route(){const k=cur,isM=/^m[1-8]$/.test(k),f=isM?()=>modView(+k[1]):V[k]||V.welcome,dir=ORDER.indexOf(k)>=ORDER.indexOf(prev)?1:-1;prev=k;pdf=null;
$("#m").innerHTML=`<section style="--dx:${dir*80}px">${f()}</section>`;$("#nav").classList.remove("open");scrollTo(0,0);if(isM)sld(+k[1],0);prog()}
addEventListener("hashchange",()=>{cur=location.hash.slice(1)||"welcome";route()});
document.addEventListener("click",e=>{const a=e.target.closest('a[href^="#"]');if(a){e.preventDefault();go(a.getAttribute("href").slice(1))}if(!e.target.closest(".sr")||a){$("#sres").innerHTML="";if(a)$("#q").value=""}});
addEventListener("keydown",e=>{if(/^m[1-8]$/.test(cur)&&!/INPUT/.test(e.target.tagName)){if(e.key=="ArrowRight")sld(+cur[1],1);if(e.key=="ArrowLeft")sld(+cur[1],-1)}});
function hh(){document.documentElement.style.setProperty("--hh",$("#hd").offsetHeight+"px")}
$("#lg").src=LOGO;addEventListener("resize",hh);hh();prev=cur;
route();
</script></body></html>
